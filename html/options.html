<!DOCTYPE html>
<html lang="ru">

  <link href="../lib/bootstrap/css/bootstrap.min.css" rel="stylesheet">

  <style>
    html, body {

      margin: 0;

      overflow: hidden;
      display: flex;

        <li class="nav-item">

        </li>
      </ul>
      <span class="island-divider"></span>
      <button type="button" id="themeToggle" class="theme-toggle"
